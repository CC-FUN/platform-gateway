spring:
  application:
    name: platform-gateway
  config:
    import:
      - "optional:nacos:platform-gateway.yaml"
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      database: 0
      username: default
      password: ${SPRING_DATA_REDIS_PASSWORD:VeryStrongRedisPass123!} # ✅ 动态密码
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:mysql://localhost:3306/platform_db?sslMode=disabled}
    username: root
    password: ${SPRING_R2DBC_PASSWORD:VeryStrongRedisPass123!}
    pool:
      enabled: true
      initial-size: 10
      max-size: 50
      validation-query: SELECT 1
  cloud:
    nacos:
      server-addr: ${SPRING_CLOUD_NACOS_SERVER_ADDR:localhost:8848}
      username: ${SPRING_CLOUD_NACOS_USERNAME:nacos}
      password: ${SPRING_CLOUD_NACOS_PASSWORD:nacos}
      discovery:
        enabled: true
        register-enabled: true
        heart-beat-interval: 3000
        heart-beat-timeout: 10000
        ip-delete-timeout: 20000
      config:
        enabled: true
        file-extension: yaml
        group: DEFAULT_GROUP
    gateway:
      server:
        webflux:
          httpclient:
            max-header-size: 20MB
          filter:
            secure-headers:
              content-security-policy: "default-src 'self' 'unsafe-inline' 'unsafe-eval' http: https: data: blob:;"    # 禁用自动服务注销，避免 Nacos 关闭时的 NPE
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "*"
                allowed-methods: "*"
                allowed-headers: "*"
                allowCredentials: true
    service-registry:
      auto-registration:
        enabled: true
        fail-fast: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  http:
    codecs:
      max-in-memory-size: 20MB
  reactor:
    context-propagation: auto
resilience4j:
  circuitbreaker:
    instances:
      userCircuitBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  ratelimiter:
    instances:
      userRateLimiter:
        limitForPeriod: 5
        limit-refresh-period: 1s
        timeout-duration: 0s
  timelimiter:
    instances:
      userCircuitBreaker:
        timeout-duration: 1ms
        cancel-running-future: true

server:
  port: 9000
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1KB
  shutdown: graceful
  http2:
    enabled: true
  max-http-request-header-size: 20MB

management:
  zipkin:
    tracing:
      connect-timeout: 1s
      endpoint: http://localhost:9411/api/v2/spans
      encoding: json
  tracing:
    sampling:
      probability: 0.1
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,gateway"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  server:
    port: 9002
    address: 127.0.0.1
springdoc:
  swagger-ui:
    enabled: true
    path: "/swagger-ui.html"
    urls:
      - name: gateway
        url: /v3/api-docs
  api-docs:
    enabled: true
    path: /v3/api-docs
jwt:
  secret: ${JWT_SECRET:thisIsAVeryLongSecretKeyForJwtSecurityTesting2025}
  expiration: 86400000


grafana:
  url: "http://localhost:9300"
  username: "admin"
  password: ${GRAFANA_PASSWORD:admin123456}
