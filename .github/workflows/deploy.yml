name: Ultimate Deploy (Maven)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chongci05/platform-gateway
  DEPLOY_PATH: /home/nic0/app/gateway

jobs:
  build-and-deploy:
    runs-on: self-hosted # 指定在你的 VPS 上跑

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 配置 Java 环境
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven' # 开启 Maven 缓存，第二次构建飞快

      # 2. Maven 打包 (跳过测试)
      - name: Build with Maven
        run: mvn clean package -DskipTests
      - name: Get POM Version
        id: get_version
        run: |
            VERSION=$(grep '^    <version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/' | xargs)
            echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV
            echo "Extracted version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      # 3. 构建应用镜像 (使用刚才改好的 Dockerfile)
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PROJECT_VERSION }} .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PROJECT_VERSION }}

      # 4. 构建数据库迁移镜像 (如果有的话)
      - name: Build Migration Image
        run: |
          docker build -t ${{ env.REGISTRY }}/chongci05/db-migration:latest -f src/main/resources/docker/Dockerfile.migration .
          docker push ${{ env.REGISTRY }}/chongci05/db-migration:latest

      # 5. 同步配置文件 (将 deploy-config 里的文件复制到 nic0 的目录)
      - name: Sync Config
        run: |
          mkdir -p ${{ env.DEPLOY_PATH }}
          cp -r deploy-config/* ${{ env.DEPLOY_PATH }}
          if [ -f "src/main/resources/docker/.env" ]; then
            cp src/main/resources/docker/.env ${{ env.DEPLOY_PATH }}/
          fi

      # 6. 部署重启
      - name: Deploy
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          NACOS_PASSWORD: ${{ secrets.NACOS_PASSWORD }}
        run: |
          cd ${{ env.DEPLOY_PATH }}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker-compose down --remove-orphans
          docker rm -f es-exporter elasticsearch redis mysql platform-gateway nacos || true
          docker-compose up -d
          docker image prune -f --filter "until=24h"